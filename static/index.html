<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QueryForge</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f0f0f;
      color: #e0e0e0;
      min-height: 100vh;
    }

    .container {
      max-width: 720px;
      margin: 0 auto;
      padding: 0 20px;
    }

    /* Header */
    .header {
      text-align: center;
      padding: 80px 0 40px;
      transition: padding 0.3s ease;
    }

    .header.compact {
      padding: 24px 0 16px;
    }

    .header h1 {
      font-size: 2.4rem;
      font-weight: 700;
      letter-spacing: -1px;
      background: linear-gradient(135deg, #60a5fa, #a78bfa);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 8px;
    }

    .header.compact h1 {
      font-size: 1.4rem;
      margin-bottom: 4px;
    }

    .header p {
      color: #888;
      font-size: 0.95rem;
    }

    .header.compact p {
      display: none;
    }

    /* Search box */
    .search-box {
      position: relative;
      margin-bottom: 32px;
    }

    .search-box input {
      width: 100%;
      padding: 14px 48px 14px 20px;
      background: #1a1a1a;
      border: 1px solid #333;
      border-radius: 12px;
      color: #e0e0e0;
      font-size: 1rem;
      outline: none;
      transition: border-color 0.2s;
    }

    .search-box input:focus {
      border-color: #60a5fa;
    }

    .search-box button {
      position: absolute;
      right: 8px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: #60a5fa;
      cursor: pointer;
      padding: 8px;
      font-size: 1.2rem;
    }

    /* Results */
    .meta {
      color: #666;
      font-size: 0.85rem;
      margin-bottom: 16px;
    }

    .result {
      background: #1a1a1a;
      border: 1px solid #262626;
      border-radius: 10px;
      padding: 16px 20px;
      margin-bottom: 12px;
      transition: border-color 0.2s;
    }

    .result:hover {
      border-color: #444;
    }

    .result-title {
      font-size: 1.05rem;
      font-weight: 600;
      color: #60a5fa;
      margin-bottom: 6px;
    }

    .result-score {
      display: inline-block;
      background: #60a5fa22;
      color: #60a5fa;
      font-size: 0.75rem;
      font-weight: 600;
      padding: 2px 8px;
      border-radius: 4px;
      margin-left: 8px;
      vertical-align: middle;
    }

    .result-snippet {
      color: #999;
      font-size: 0.9rem;
      line-height: 1.5;
    }

    .result-snippet mark {
      background: #60a5fa33;
      color: #60a5fa;
      border-radius: 2px;
      padding: 0 2px;
    }

    .empty {
      text-align: center;
      padding: 48px 0;
      color: #555;
    }

    .empty .icon { font-size: 2.5rem; margin-bottom: 12px; }
    .empty p { font-size: 0.95rem; }

    /* Stats bar */
    .stats {
      display: flex;
      justify-content: center;
      gap: 32px;
      margin-top: 12px;
      margin-bottom: 32px;
    }

    .stat {
      text-align: center;
    }

    .stat-value {
      font-size: 1.5rem;
      font-weight: 700;
      color: #60a5fa;
    }

    .stat-label {
      font-size: 0.75rem;
      color: #666;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    /* Hint */
    .hint {
      text-align: center;
      color: #444;
      font-size: 0.8rem;
      margin-top: 24px;
    }

    .hint code {
      background: #1a1a1a;
      padding: 2px 6px;
      border-radius: 4px;
      color: #888;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header" id="header">
      <h1>QueryForge</h1>
      <p>Full-text search with BM25 ranking — built from scratch</p>
    </div>

    <div class="search-box">
      <input type="text" id="query" placeholder="Search documents..." autofocus>
      <button onclick="doSearch()">&#x2192;</button>
    </div>

    <div id="stats" class="stats"></div>
    <div id="meta"></div>
    <div id="results"></div>

    <div class="hint" id="hint">
      Supports boolean operators: <code>python AND java</code> &middot;
      <code>machine OR deep</code> &middot; <code>python NOT java</code>
    </div>
  </div>

  <script>
    const input = document.getElementById("query");
    const resultsDiv = document.getElementById("results");
    const metaDiv = document.getElementById("meta");
    const statsDiv = document.getElementById("stats");
    const header = document.getElementById("header");
    const hint = document.getElementById("hint");

    // Load stats on page load
    fetch("/api/stats")
      .then(r => r.json())
      .then(data => {
        statsDiv.innerHTML = `
          <div class="stat">
            <div class="stat-value">${data.documents}</div>
            <div class="stat-label">Documents</div>
          </div>
          <div class="stat">
            <div class="stat-value">${data.unique_terms.toLocaleString()}</div>
            <div class="stat-label">Unique Terms</div>
          </div>
          <div class="stat">
            <div class="stat-value">${data.avg_doc_length}</div>
            <div class="stat-label">Avg Length</div>
          </div>
        `;
      });

    input.addEventListener("keydown", e => {
      if (e.key === "Enter") doSearch();
    });

    let debounceTimer;
    input.addEventListener("input", () => {
      clearTimeout(debounceTimer);
      debounceTimer = setTimeout(() => {
        if (input.value.trim().length > 1) doSearch();
      }, 300);
    });

    function doSearch() {
      const q = input.value.trim();
      if (!q) return;

      header.classList.add("compact");
      statsDiv.style.display = "none";
      hint.style.display = "none";

      fetch(`/api/search?q=${encodeURIComponent(q)}`)
        .then(r => r.json())
        .then(data => {
          metaDiv.innerHTML = `<div class="meta">${data.total} result${data.total !== 1 ? "s" : ""} for "${escapeHtml(data.query)}"</div>`;

          if (data.results.length === 0) {
            resultsDiv.innerHTML = `
              <div class="empty">
                <div class="icon">&#128269;</div>
                <p>No results found for "${escapeHtml(q)}"</p>
              </div>`;
            return;
          }

          resultsDiv.innerHTML = data.results.map(r => `
            <div class="result">
              <div class="result-title">
                ${escapeHtml(r.title)}
                <span class="result-score">${r.score.toFixed(3)}</span>
              </div>
              <div class="result-snippet">${highlightTerms(r.snippet, q)}</div>
            </div>
          `).join("");
        });
    }

    function escapeHtml(s) {
      const div = document.createElement("div");
      div.textContent = s;
      return div.innerHTML;
    }

    function highlightTerms(snippet, query) {
      let safe = escapeHtml(snippet);
      const terms = query.toLowerCase().split(/\s+/).filter(t =>
        !["and", "or", "not"].includes(t) && t.length > 1
      );
      for (const term of terms) {
        const re = new RegExp(`(${term.replace(/[.*+?^${}()|[\]\\]/g, "\\$&")}\\w*)`, "gi");
        safe = safe.replace(re, "<mark>$1</mark>");
      }
      return safe;
    }
  </script>
</body>
</html>
